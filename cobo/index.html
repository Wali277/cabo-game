<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <!-- Prevent stale-HTML cache on phones: assets are hash-named so they
         self-bust, but the index.html itself must always be revalidated so
         it picks up the newest hashed bundle names after each deploy. -->
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
    <meta http-equiv="Pragma" content="no-cache" />
    <meta http-equiv="Expires" content="0" />
    <!-- Preload Fredoka (self-hosted in /public/fonts/) so the title doesn't
         pop in after first paint in Firefox/Edge, which were taking a full
         render cycle longer than Chrome to apply the font. crossorigin is
         required for font preloads even when same-origin. -->
    <link
      rel="preload"
      href="/fonts/fredoka-latin.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <!-- PWA / Add-to-Home-Screen: installed icon, manifest, and iOS standalone
         hints. black-translucent + viewport-fit=cover (above) lets the game run
         edge-to-edge under the status bar for the "more space" full-screen feel. -->
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#0d1638" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="CABO" />
    <title>CABO!</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
